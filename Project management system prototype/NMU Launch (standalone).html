place-items:center;padding:20px\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"resched-title\" style=\"width:min(820px,100%);max-height:88vh;overflow:auto;background:#FFFFFF;box-shadow:0 24px 48px -12px rgba(20,33,61,.28);border-radius:14px;padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px\">\n        <div>\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Reschedule preview · {{ rs.program }}<\u002Fdiv>\n          <h2 id=\"resched-title\" style=\"font-size:20px;margin:4px 0 0\">Move Day 1<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap\">\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Current<div style=\"padding:7px 0;font-size:15px;color:#14213D\">{{ rs.oldLabel }}<\u002Fdiv><\u002Flabel>\n          <i aria-hidden=\"true\" class=\"ph ph-arrow-right\" style=\"padding-bottom:10px;color:#56627F\"><\u002Fi>\n          <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">New Day 1<input id=\"resched-date\" type=\"date\" value=\"{{ rs.newDate }}\" sc-camel-on-change=\"{{ rs.onDate }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:15px\"><\u002Flabel>\n          <div style=\"padding-bottom:8px;font-size:14px;color:#1F3A9E\">{{ rs.deltaLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#46526F\">{{ rs.summary }}<\u002Fdiv>\n        <sc-if value=\"{{ rs.hasFollow }}\">\n          <div style=\"padding:12px 14px;border:1px solid #9DB4EC;border-radius:8px\">\n            <div style=\"font-size:12.5px;color:#1F3A9E;margin-bottom:6px\">Suggested follow-ups — not sent automatically<\u002Fdiv>\n            <sc-for list=\"{{ rs.follow }}\" as=\"f\"><div style=\"font-size:13.5px;padding:3px 0;display:flex;gap:8px\"><i aria-hidden=\"true\" class=\"ph ph-arrow-bend-down-right\" style=\"color:#56627F;margin-top:2px\"><\u002Fi><span>{{ f }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ rs.hasManual }}\">\n          <div>\n            <div style=\"font-size:12.5px;color:#56627F;margin-bottom:6px\">Manually edited dates — kept unless you choose to move them<\u002Fdiv>\n            <sc-for list=\"{{ rs.manual }}\" as=\"r\"><label style=\"display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 0;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ r.move }}\" sc-camel-on-change=\"{{ r.toggle }}\" style=\"accent-color:#2340A8\">{{ r.name }} <span style=\"color:#56627F\">({{ r.oldLabel }})<\u002Fspan><\u002Flabel><\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"border:1px solid #E7ECF4;border-radius:8px;overflow:hidden;max-height:300px;overflow-y:auto\">\n          <sc-for list=\"{{ rs.rows }}\" as=\"r\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 80px 20px 80px 110px;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid #E7ECF4;font-size:13.5px;opacity:{{ r.opacity }}\">\n              <div style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fdiv>\n              <div style=\"color:#56627F\">{{ r.oldLabel }}<\u002Fdiv>\n              <i aria-hidden=\"true\" class=\"ph ph-arrow-right\" style=\"color:#5E6987\"><\u002Fi>\n              <div style=\"color:{{ r.newColor }}\">{{ r.newLabel }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:{{ r.flagColor }}\">{{ r.flag }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;justify-content:flex-end\">\n          <button sc-camel-on-click=\"{{ closeResched }}\" style=\"background:transparent;border:1px solid #8792AC;color:#2E3A59;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;flex:none\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ applyResched }}\" disabled=\"{{ rs.noChange }}\" style=\"background:transparent;border:1px solid #2340A8;color:#1F3A9E;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;opacity:{{ rs.applyOpacity }};white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\">Apply &amp; log change<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div role=\"status\" aria-live=\"polite\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap\">{{ toast }}<\u002Fdiv>\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14213D;color:#FFFFFF;box-shadow:0 8px 24px -6px rgba(20,33,61,.3);border-radius:8px;padding:9px 16px;font-size:14px;z-index:60;display:flex;gap:8px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-check-circle\" style=\"color:#9DC4FF\"><\u002Fi>{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst ST = {\n  'Not started': { bg: '#E7ECF4', fg: '#2E3A59' },\n  'In progress': { bg: '#DCE7FB', fg: '#1A3A8F' },\n  'Blocked': { bg: '#FBE4E0', fg: '#962B1E' },\n  'Done': { bg: '#DDF0E5', fg: '#1A6641' },\n};\nconst WARN = '#8A4600';\nconst HEALTH = {\n  'On track': ST['Done'], 'Watch': { bg: '#FCF0D4', fg: '#734A00' },\n  'At risk': { bg: '#FDE5D1', fg: '#8A3A00' }, 'Blocked': ST['Blocked'], 'Wrapping up': ST['Not started'],\n};\nconst NAV = {\n  mytasks: ['My tasks', 'ph ph-check-square'], programs: ['All programs', 'ph ph-squares-four'], new: ['New program', 'ph ph-plus-circle'],\n  history: ['Change history', 'ph ph-clock-counter-clockwise'], templates: ['Program types', 'ph ph-tree-structure'],\n  admin: ['Users & data', 'ph ph-users-three'], portal: ['Partner portal', 'ph ph-handshake'],\n};\nconst ACCESS = {\n  'Program Manager': ['mytasks', 'programs', 'new', 'history', 'templates', 'admin'],\n  'Program Assistant': ['mytasks', 'programs', 'new', 'history'],\n  'Executive Director': ['programs', 'mytasks', 'history', 'templates', 'admin'],\n  'Marketing Director': ['mytasks', 'programs', 'history'],\n  'Operations Director': ['mytasks', 'programs', 'history'],\n  'Grant Writer': ['mytasks', 'programs', 'history'],\n  'Board Member': ['programs', 'history'],\n  'Partner': ['portal'],\n};\nconst ACCESS_NOTE = {\n  'Board Member': 'Read-only: all programs and history.',\n  'Partner': 'Partner: own site’s tasks only.',\n  'Program Manager': 'Full access incl. templates & users.',\n  'Executive Director': 'Full access incl. templates & users.',\n};\nconst FIELD_LABEL = { status: 'Status', due: 'Due date', ownerId: 'Owner' };\nconst SITE_FIELDS = [\n  ['partnerOrg', 'Partner organization', 'e.g. UW Recreation'], ['pocName', 'Point of contact', 'Head coach / aquatics director'],\n  ['pocEmail', 'Contact email', ''], ['pocPhone', 'Contact phone', ''], ['shipping', 'Shipping address', 'Where equipment ships'],\n  ['hours', 'Pool hours', 'e.g. Tue/Thu 6–8 PM'], ['instructors', 'Lead instructor(s)', ''], ['driveUrl', 'Shared Drive folder', 'https://drive.google.com/…'],\n];\n\nconst UNIT = { days: 1, weeks: 7, months: 30 };\nconst splitOff = o => {\n  if (o >= 0 && o <= 4) return { dir: 'during', n: o + 1, unit: 'days' };\n  const dir = o < 0 ? 'before' : 'after', a = o < 0 ? -o : o - 4;\n  const unit = a >= 60 && a % 30 === 0 ? 'months' : a >= 7 && a % 7 === 0 ? 'weeks' : 'days';\n  return { dir, n: a / UNIT[unit], unit };\n};\nconst joinOff = d => d.dir === 'during' ? Math.min(5, Math.max(1, d.n)) - 1 : d.dir === 'before' ? -d.n * UNIT[d.unit] : 4 + d.n * UNIT[d.unit];\nconst whenText = o => {\n  const x = splitOff(o);\n  if (x.dir === 'during') return `Program day ${x.n}`;\n  const u = x.n === 1 ? x.unit.slice(0, -1) : x.unit;\n  return x.dir === 'before' ? `${x.n} ${u} before Day 1` : `${x.n} ${u} after the program ends`;\n};\n\nclass Component extends DCLogic {\n  state = { ready: false, db: null, myProgram: 'all', tplOpen: {}, tplQuery: '', tplDay1: null, tplEdit: null, tplShowOther: false, expanded: {}, phaseOpen: {}, timelineAll: {}, view: 'mytasks', userId: 'usr_jordan', programId: null, tab: 'timeline', taskId: null, myScope: 'open', histProgram: 'all', tplType: 'typ_SSS', wiz: null, resched: null, siteDraft: null, addTask: null, newUser: { name: '', email: '', role: 'Program Assistant' }, note: '', toast: '' };\n\n  async componentDidMount() {\n    while (!window.NMUData) await new Promise(r => setTimeout(r, 30));\n    const m = window.NMUData;\n    this.m = m; this.api = m.createAdapter();\n    const db = await this.api.listAll();\n    let ui = {}; try { ui = JSON.parse(localStorage.getItem('nmu-launch-ui-v2') || '{}'); } catch (e) { }\n    this.setState({ ready: true, db, ...ui });\n    this._onKey = e => { if (e.key !== 'Escape') return; if (this.state.tplEdit) this.setState({ tplEdit: null }); else if (this.state.resched) this.setState({ resched: null }); else if (this.state.taskId) this.setState({ taskId: null }); };\n    window.addEventListener('keydown', this._onKey);\n  }\n  componentWillUnmount() { window.removeEventListener('keydown', this._onKey); }\n  // Move focus into dialogs on open and back to the trigger on close (tracked manually; runs after paint).\n  syncFocus() {\n    const pairs = [['taskId', 'drawer-close'], ['tplEdit', 'te-name'], ['resched', 'resched-date']];\n    this._fprev = this._fprev || {}; this._fret = this._fret || {};\n    for (const [k, id] of pairs) {\n      const was = !!this._fprev[k], now = !!this.state[k];\n      if (!was && now) {\n        this._fret[k] = document.activeElement;\n        let tries = 0;\n        const tick = () => { const el = document.getElementById(id); if (el) el.focus(); else if (tries++ < 20) requestAnimationFrame(tick); };\n        requestAnimationFrame(tick);\n      } else if (was && !now) {\n        const el = this._fret[k]; this._fret[k] = null;\n        if (el && el.isConnected) requestAnimationFrame(() => el.focus());\n      }\n      this._fprev[k] = now;\n    }\n  }\n  componentDidUpdate(pp, ps) {\n    if (!this.state.ready) return;\n    const { view, userId, programId, tab, myProgram } = this.state;\n    localStorage.setItem('nmu-launch-ui-v2', JSON.stringify({ view, userId, programId, tab, myProgram }));\n  }\n  go(view, extra = {}) { this.setState({ view, taskId: null, tplEdit: null, siteDraft: null, addTask: null, ...extra }); window.scrollTo(0, 0); setTimeout(() => document.getElementById('main')?.focus({ preventScroll: true }), 0); }\n  flash(msg) { this.setState({ toast: msg }); clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast: '' }), 2600); }\n  fail(e) { this.flash('Save failed — ' + e.message); }\n  local(table, id, p) { this.setState(s => ({ db: { ...s.db, [table]: s.db[table].map(r => r.id === id ? { ...r, ...p } : r) } })); }\n  patch(table, id, p) { this.local(table, id, p); this.api.update(table, id, p).catch(e => this.fail(e)); }\n  patchMany(table, list) {\n    const mp = Object.fromEntries(list.map(x => [x.id, x.patch]));\n    this.setState(s => ({ db: { ...s.db, [table]: s.db[table].map(r => mp[r.id] ? { ...r, ...mp[r.id] } : r) } }));\n    this.api.updateMany(table, list).catch(e => this.fail(e));\n  }\n  insert(table, recs) {\n    this.setState(s => ({ db: { ...s.db, [table]: [...s.db[table], ...recs] } }));\n    return this.api.createMany(table, recs).then(() => { if (this.api.mode !== 'mock') this.reload(); }).catch(e => this.fail(e));\n  }\n  async reload() { const db = await this.api.listAll(); this.setState({ db }); }\n  log(e) { this.insert('ChangeLog', [{ id: this.m.rid('log'), at: new Date().toISOString(), userId: this.state.userId, programId: '', taskId: '', field: '', from: '', to: '', note: '', ...e }]); }\n  uname(id) { const u = this.state.db.Users.find(x => x.id === id); return u ? u.name : 'Unassigned'; }\n  setTask(t, field, val) {\n    if (t[field] === val) return;\n    const p = { [field]: val }; if (field === 'due') p.manualDate = true;\n    this.patch('Tasks', t.id, p);\n    const f = field === 'ownerId' ? (x => this.uname(x)) : field === 'due' ? this.m.fmt : (x => x);\n    this.log({ programId: t.programId, taskId: t.id, field: FIELD_LABEL[field], from: f(t[field]), to: f(val) });\n  }\n  freshWiz() { return { step: 1, name: '', location: '', typeId: 'typ_LTS', day1: this.m.addDays(this.m.today(), 120), partnerOrg: '', pocName: '', pocEmail: '', pocPhone: '', shipping: '', hours: '', instructors: '', driveUrl: '', draft: null, pid: this.m.rid('prg') }; }\n  getWiz() { return this.state.wiz || this._fw || (this._fw = this.freshWiz()); }\n  setWiz(p) { this.setState({ wiz: { ...this.getWiz(), ...p } }); }\n\n  renderVals() {\n    const s = this.state;\n    const base = { loading: true, stop: e => e.stopPropagation() };\n    if (!s.ready) return base;\n    setTimeout(() => this.syncFocus(), 0);\n    const m = this.m, db = s.db, t0 = m.today();\n    const users = db.Users, uById = Object.fromEntries(users.map(u => [u.id, u]));\n    const me = uById[s.userId] || users[0];\n    const access = ACCESS[me.role] || ['programs'];\n    let view = s.view;\n    if (view === 'program' ? !access.includes('programs') : !access.includes(view)) view = access[0];\n    const readOnly = me.role === 'Board Member';\n    const isPartner = me.role === 'Partner';\n    const tyById = Object.fromEntries(db.ProgramTypes.map(t => [t.id, t]));\n    const pById = Object.fromEntries(db.Programs.map(p => [p.id, p]));\n    const tasks = db.Tasks, tById = Object.fromEntries(tasks.map(t => [t.id, t]));\n    const roles = m.ROLES;\n\n    const ck = [db.Tasks, db.Programs, db.Users, readOnly, t0];\n    if (!this._vc || this._vc.key.some((k, i) => k !== ck[i])) this._vc = { key: ck, vm: new Map(), ps: new Map() };\n    const cache = this._vc;\n    const vm = t => {\n      let v = cache.vm.get(t.id);\n      if (!v) { v = vmRaw(t); cache.vm.set(t.id, v); }\n      return v;\n    };\n    const vmRaw = t => {\n      const p = pById[t.programId] || {};\n      const d = m.diffDays(t.due, t0), done = t.status === 'Done';\n      const off = m.diffDays(t.due, p.day1);\n      const waiting = (t.dependsOn || []).map(id => tById[id]).filter(x => x && x.status !== 'Done');\n      const st = ST[t.status] || ST['Not started'];\n      return {\n        id: t.id, name: t.name, statusLabel: `Status for ${t.name}`, status: t.status, statusBg: st.bg, statusFg: st.fg, d, done, due: t.due,\n        sub: `${p.name} · ${m.phaseOf(off)}`, timing: m.timingLabel(off) + (t.templateId ? '' : ' · added task'),\n        dueLabel: m.fmt(t.due), relLabel: done ? 'Completed' : d < 0 ? `${-d}d overdue` : d === 0 ? 'Due today' : `in ${d}d`,\n        relColor: !done && d < 0 ? WARN : '#56627F',\n        ownerName: t.ownerId ? (uById[t.ownerId] || {}).name : `Unassigned · ${t.role}`, ownerColor: t.ownerId ? '#2E3A59' : WARN,\n        partnerOwned: !!t.partnerOwned, waiting: waiting.length > 0 && !done, waitLabel: `Waiting on ${waiting.length}`, waitTitle: waiting.map(x => x.name).join(', '),\n        open: () => this.setState({ taskId: t.id, note: '' }), onStatus: e => this.setTask(t, 'status', e.target.value), disabled: readOnly,\n      };\n    };\n    const progStats = p => {\n      if (!cache.ps.has(p.id)) cache.ps.set(p.id, progStatsRaw(p));\n      return cache.ps.get(p.id);\n    };\n    const progStatsRaw = p => {\n      const pt = tasks.filter(t => t.programId === p.id);\n      const done = pt.filter(t => t.status === 'Done').length;\n      const overdue = pt.filter(t => t.status !== 'Done' && t.due < t0).length;\n      const blocked = pt.filter(t => t.status === 'Blocked').length;\n      const d = m.diffDays(p.day1, t0);\n      const health = blocked ? 'Blocked' : overdue >= 3 ? 'At risk' : overdue ? 'Watch' : d < -14 ? 'Wrapping up' : 'On track';\n      return { pt, done, total: pt.length, overdue, blocked, d, health, countdown: d > 0 ? `in ${d} days` : d === 0 ? 'today' : `running · day ${-d + 1}` };\n    };\n\n    const nav = access.map(k => {\n      const active = view === k || (k === 'programs' && view === 'program');\n      let badge = '';\n      if (k === 'mytasks') { const n = tasks.filter(t => t.ownerId === me.id && t.status !== 'Done' && t.due < t0).length; badge = n ? `${n} late` : ''; }\n      return { label: NAV[k][0], icon: NAV[k][1], badge, current: active ? 'page' : undefined, bg: active ? '#E4ECFC' : 'transparent', fg: active ? '#142B7A' : '#2E3A59', go: () => this.go(k, k === 'new' ? { wiz: this.freshWiz() } : {}) };\n    });\n    const progOpts = db.Programs.map(p => ({ id: p.id, name: p.name }));\n\n    const out = {\n      ...base, loading: false, roles, progOpts, nav, userId: me.id,\n      userOpts: users.filter(u => u.active).map(u => ({ id: u.id, label: `${u.name} — ${u.role}` })),\n      onUser: e => this.go(this.state.view, { userId: e.target.value }),\n      accessNote: ACCESS_NOTE[me.role] || 'Staff: tasks, programs, history.',\n      modeLabel: this.api.mode === 'mock' ? 'Mock data · saved in this browser' : 'Connected to Airtable',\n      modeDot: this.api.mode === 'mock' ? '#B86E00' : '#1C7A4C',\n      meRole: me.role, canEdit: !readOnly, canCreate: access.includes('new'),\n      goNew: () => this.go('new', { wiz: this.freshWiz() }), goPrograms: () => this.go('programs'),\n      isMy: view === 'mytasks', isPrograms: view === 'programs', isProgram: view === 'program', isNew: view === 'new',\n      isTemplates: view === 'templates', isHistory: view === 'history', isPortal: view === 'portal', isAdmin: view === 'admin',\n      toast: s.toast, hasToast: !!s.toast,\n    };\n\n    if (view === 'mytasks') {\n      const mineAll = tasks.filter(t => t.ownerId === me.id);\n      const myProgIds = [...new Set(mineAll.map(t => t.programId))].filter(id => pById[id]).sort((a, b) => pById[a].day1 < pById[b].day1 ? -1 : 1);\n      const pf = myProgIds.includes(s.myProgram) ? s.myProgram : 'all';\n      const mine = mineAll.filter(t => pf === 'all' || t.programId === pf).map(vm).sort((a, b) => a.d - b.d);\n      const open = mine.filter(x => !x.done);\n      const openCount = id => mineAll.filter(t => t.status !== 'Done' && (id === 'all' || t.programId === id)).length;\n      const odCount = id => mineAll.filter(t => t.status !== 'Done' && t.due < t0 && (id === 'all' || t.programId === id)).length;\n      const progFilters = [['all', 'All programs'], ...myProgIds.map(id => [id, pById[id].name])].map(([id, label]) => {\n        const on = pf === id, od = odCount(id);\n        return {\n          label, count: openCount(id), selected: on, hasOverdue: od > 0 && !on, odLabel: `${od} overdue`,\n          ariaLabel: `${label}: ${openCount(id)} open${od ? `, ${od} overdue` : ''}`,\n          bg: on ? '#2340A8' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14213D', border: on ? '#2340A8' : '#8792AC', countFg: on ? '#DCE7FB' : '#56627F',\n          go: () => this.setState({ myProgram: id, expanded: {} }),\n        };\n      });\n      const laterT = open.filter(x => x.d > 30), showLater = !!s.expanded.__later, cutoff = m.fmt(m.addDays(t0, 30));\n      const groups = [\n        { label: 'Overdue', color: WARN, tasks: open.filter(x => x.d < 0), capped: true },\n        { label: 'Due in the next 7 days', tasks: open.filter(x => x.d >= 0 && x.d <= 7) },\n        { label: 'Later this month', tasks: open.filter(x => x.d > 7 && x.d <= 30) },\n        ...(showLater ? [{ label: `Due after ${cutoff}`, tasks: laterT }] : []),\n        ...(s.myScope === 'all' ? [{ label: 'Completed', tasks: mine.filter(x => x.done).reverse() }] : []),\n      ].filter(g => g.tasks.length).map(g => {\n        const cap = g.capped && !s.expanded[g.label] && g.tasks.length > 12;\n        return { ...g, color: g.color || '#2E3A59', count: g.tasks.length, tasks: cap ? g.tasks.slice(0, 12) : g.tasks, hasMore: cap, moreLabel: `Show ${g.tasks.length - 12} more`, showMore: () => this.setState({ expanded: { ...this.state.expanded, [g.label]: true } }) };\n      });\n      const nProg = new Set(open.map(x => x.sub.split(' · ')[0])).size;\n      out.my = {\n        groups, empty: !groups.length, emptyText: laterT.length ? 'Nothing overdue or due in the next 30 days.' : 'Nothing assigned to you right now.',\n        hasLater: laterT.length > 0, showLater, laterIcon: showLater ? 'ph ph-caret-up' : 'ph ph-caret-down',\n        laterLabel: showLater ? `Hide tasks due after ${cutoff}` : `Show ${laterT.length} more task${laterT.length === 1 ? '' : 's'} due after ${cutoff}`,\n        toggleLater: () => this.setState({ expanded: { ...this.state.expanded, __later: !showLater } }),\n        progFilters, hasProgFilters: myProgIds.length > 1, filtered: pf !== 'all',\n        filterName: pf !== 'all' ? pById[pf].name : '', filterDay1: pf !== 'all' ? `Day 1 ${m.fmtLong(pById[pf].day1)}` : '',\n        openProgram: () => this.go('program', { programId: pf, tab: 'timeline' }), canOpenProgram: access.includes('programs'),\n        summary: pf !== 'all'\n          ? `${open.filter(x => x.d < 0).length} overdue · ${open.filter(x => x.d >= 0 && x.d <= 30).length} due in the next 30 days · ${open.length} open for this program`\n          : `${open.filter(x => x.d < 0).length} overdue · ${open.filter(x => x.d >= 0 && x.d <= 30).length} due in the next 30 days · ${open.length} open across ${nProg} program${nProg === 1 ? '' : 's'}`,\n        scopes: [['open', 'Open'], ['all', 'Include completed']].map(([k, l]) => ({ label: l, selected: s.myScope === k, bg: s.myScope === k ? '#E7ECF4' : 'transparent', fg: s.myScope === k ? '#14213D' : '#46526F', go: () => this.setState({ myScope: k }) })),\n      };\n    }\n\n    if (view === 'programs') {\n      const rows = db.Programs.slice().sort((a, b) => a.day1 < b.day1 ? -1 : 1).map(p => {\n        const st           this.setState({ newUser: { name: '', email: '', role: 'Program Assistant' } }); this.flash(`${u.name} added`);\n        },\n      };\n      out.ad = {\n        isMock: this.api.mode === 'mock',\n        modeHelp: this.api.mode === 'mock' ? 'Running on sample data stored in this browser. Point the app at a server proxy that holds the Airtable token to switch to live data — no UI changes needed.' : 'Reading and writing through the server proxy.',\n        reset: async () => { const db2 = await this.api.reset(); this.setState({ db: db2, taskId: null }); this.flash('Demo data reset'); },\n        tables: Object.entries(m.SCHEMA).map(([k, v]) => ({ table: v.table, count: db[k].length, fields: Object.keys(v.fields).length })),\n        users: users.map(u => ({\n          roleAria: `Role for ${u.name}`, progAria: `Partner program for ${u.name}`, name: u.name, email: u.email, role: u.role, roleKey: u.id + u.role, progKey: u.id + (u.programId || '-'), programId: u.programId, isPartner: u.role === 'Partner', notPartner: u.role !== 'Partner',\n          isMe: u.id === me.id, opacity: u.active ? 1 : 0.5, activeLabel: u.active ? 'Deactivate' : 'Reactivate',\n          onRole: e => { this.patch('Users', u.id, { role: e.target.value }); this.log({ field: `Role · ${u.name}`, from: u.role, to: e.target.value }); },\n          onProgram: e => { this.patch('Users', u.id, { programId: e.target.value }); this.log({ programId: e.target.value, field: `Partner access · ${u.name}`, from: pById[u.programId]?.name || '—', to: pById[e.target.value]?.name || '—' }); },\n          toggle: () => { this.patch('Users', u.id, { active: !u.active }); this.log({ field: `Access · ${u.name}`, from: u.active ? 'Active' : 'Inactive', to: u.active ? 'Inactive' : 'Active' }); },\n        })),\n      };\n    }\n\n    // Task drawer\n    const t = s.taskId && tById[s.taskId];\n    out.hasTask = !!t;\n    out.closeTask = () => this.setState({ taskId: null });\n    out.note = s.note; out.onNote = e => this.setState({ note: e.target.value });\n    out.noteEmpty = !s.note.trim(); out.noteOpacity = s.note.trim() ? 1 : 0.45;\n    if (t) {\n      const p = pById[t.programId] || {}, off = m.diffDays(t.due, p.day1);\n      const owner = uById[t.ownerId];\n      out.dr = {\n        kicker: `${p.name} · ${m.phaseOf(off)}`, name: t.name, ownerKey: t.id + (t.ownerId || '-'), due: t.due, ownerId: t.ownerId, role: t.role,\n        tags: [m.timingLabel(off), t.partnerOwned ? 'Partner-owned' : '', t.manualDate ? 'Date set manually' : '', t.templateId ? '' : 'Added task', (t.supportRoles || []).length ? `With: ${t.supportRoles.join(', ')}` : ''].filter(Boolean),\n        lockStatus: readOnly, lockPlan: readOnly || isPartner,\n        statusOpts: m.STATUSES.map(x => { const on = t.status === x, c = ST[x]; return { label: x, selected: on, bg: on ? c.bg : 'transparent', fg: on ? c.fg : '#46526F', border: on ? c.bg : '#8792AC', set: () => this.setTask(t, 'status', x) }; }),\n        onDue: e => e.target.value && this.setTask(t, 'due', e.target.value),\n        onOwner: e => this.setTask(t, 'ownerId', e.target.value),\n        ownerOpts: users.filter(u => u.active && (u.role !== 'Partner' || u.programId === t.programId)).map(u => ({ id: u.id, label: `${u.name} · ${u.role}` })),\n        reminder: `Email reminders go to ${owner ? owner.name : 'the owner (unassigned)'}${t.partnerOwned ? ' and the site contact' : ''} on ${m.fmt(m.addDays(t.due, -7))} and ${m.fmt(t.due)}.`,\n        deps: (t.dependsOn || []).map(id => tById[id]).filter(Boolean).map(d => ({ name: d.name, status: d.status, bg: ST[d.status].bg, fg: ST[d.status].fg, open: () => this.setState({ taskId: d.id }) })),\n        blocks: tasks.filter(x => (x.dependsOn || []).includes(t.id)).map(d => ({ name: d.name, dueLabel: m.fmt(d.due), open: () => this.setState({ taskId: d.id }) })),\n        notes: (t.notes || '').split('\\n').filter(Boolean),\n        log: db.ChangeLog.filter(l => l.taskId === t.id).sort((a, b) => a.at < b.at ? 1 : -1).map(l => this.logVM(l, uById, tById, pById)),\n      };\n      out.dr.hasDeps = out.dr.deps.length > 0; out.dr.hasBlocks = out.dr.blocks.length > 0; out.dr.hasLog = out.dr.log.length > 0;\n      out.addNote = () => {\n        const txt = this.state.note.trim(); if (!txt) return;\n        const line = `[${m.fmt(t0)} · ${me.name}] ${txt}`;\n        this.patch('Tasks', t.id, { notes: (t.notes ? t.notes + '\\n' : '') + line });\n        this.log({ programId: t.programId, taskId: t.id, field: 'Note', note: txt });\n        this.setState({ note: '' });\n      };\n    }\n\n    // Reschedule preview\n    const r = s.resched;\n    out.hasResched = !!r;\n    out.closeResched = () => this.setState({ resched: null });\n    if (r) {\n      const p = pById[r.programId], delta = r.newDate ? m.diffDays(r.newDate, p.day1) : 0;\n      const pt = tasks.filter(x => x.programId === p.id).sort((a, b) => a.due < b.due ? -1 : 1);\n      const rows = pt.map(x => {\n        const done = x.status === 'Done', manual = !!x.manualDate && !done;\n        const move = !done && delta !== 0 && (!manual || !!r.moveManual[x.id]);\n        const nd = move ? m.addDays(x.due, delta) : x.due;\n        const past = move && nd < t0;\n        return { x, done, manual, move, nd, past };\n      });\n      const moved = rows.filter(z => z.move), past = moved.filter(z => z.past).length;\n      const kept = rows.filter(z => z.done).length;\n      const regDone = pt.some(x => /registration/i.test(x.name) && x.status === 'Done');\n      const follow = delta === 0 ? [] : [\n        `Email ${p.pocName || 'the site contact'}${p.partnerOrg ? ` at ${p.partnerOrg}` : ''} to confirm the new Day 1, ${m.fmtLong(r.newDate)}.`,\n        `Let lead instructors know${p.instructors ? ` (${p.instructors})` : ''}.`,\n        ...(regDone ? ['Registration is already open — update the listing and notify registered participants.'] : []),\n        ...(past ? [`${past} moved task${past > 1 ? 's' : ''} would land in the past — review them after applying.`] : []),\n      ];\n      out.rs = {\n        program: p.name, oldLabel: m.fmtLong(p.day1), newDate: r.newDate,\n        onDate: e => this.setState({ resched: { ...this.state.resched, newDate: e.target.value } }),\n        deltaLabel: delta === 0 ? 'No change' : `${delta > 0 ? '+' : ''}${delta} days`,\n        summary: delta === 0 ? 'Pick a new date to preview how the timeline shifts.' : `${moved.length} open tasks move by ${delta > 0 ? '+' : ''}${delta} days · ${kept} completed tasks keep their dates · ${rows.filter(z => z.manual && !z.move).length} manually edited kept.`,\n        follow, hasFollow: follow.length > 0,\n        manual: rows.filter(z => z.manual).map(z => ({ name: z.x.name, oldLabel: m.fmt(z.x.due), move: !!r.moveManual[z.x.id], toggle: () => this.setState({ resched: { ...this.state.resched, moveManual: { ...this.state.resched.moveManual, [z.x.id]: !this.state.resched.moveManual[z.x.id] } } }) })),\n        rows: rows.map(z => ({\n          name: z.x.name, oldLabel: m.fmt(z.x.due), newLabel: m.fmt(z.nd), opacity: z.move ? 1 : 0.5,\n          newColor: z.past ? WARN : z.move ? '#1F3A9E' : '#56627F',\n          flag: z.done ? 'Done · kept' : z.manual && !z.move ? 'Manual · kept' : z.past ? 'Lands in past' : z.move ? 'Moves' : '',\n          flagColor: z.past ? WARN : '#56627F',\n        })),\n        noChange: delta === 0 || !r.newDate, applyOpacity: delta === 0 ? 0.45 : 1,\n      };\n      out.rs.hasManual = out.rs.manual.length > 0;\n      out.applyResched = () => {\n        if (!delta) return;\n        this.patchMany('Tasks', moved.map(z => ({ id: z.x.id, patch: { due: z.nd } })));\n        this.patch('Programs', p.id, { day1: r.newDate });\n        this.log({ programId: p.id, field: 'Day 1', from: m.fmt(p.day1), to: m.fmt(r.newDate), note: `Moved ${moved.length} open tasks by ${delta > 0 ? '+' : ''}${delta}d; ${kept} completed kept` });\n        this.setState({ resched: null }); this.flash(`Day 1 moved · ${moved.length} tasks rescheduled`);\n      };\n    }\n    return out;\n  }\n\n  logVM(l, uById, tById, pById) {\n    const t = l.taskId && tById[l.taskId];\n    const change = l.from || l.to ? (l.from ? `${l.from} → ${l.to}` : l.to) : '';\n    return {\n      when: this.m.fmtWhen(l.at), who: (uById[l.userId] || {}).name || '—', program: (pById[l.programId] || {}).name || 'System',\n      what: t ? `${t.name} · ${l.field}` : l.field, change: change ? `: ${change}` : '', note: l.note, hasNote: !!l.note,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
