  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

id-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n                <sc-for list=\"{{ sd.fields }}\" as=\"f\">\n                  <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">{{ f.label }}<input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:7px 9px;font-size:14px\"><\u002Flabel>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:14px\">\n                <button sc-camel-on-click=\"{{ cancelSite }}\" style=\"background:transparent;border:1px solid #8792AC;color:#2E3A59;border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap;flex:none\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ saveSite }}\" style=\"background:transparent;border:1px solid #2340A8;color:#1F3A9E;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\">Save changes<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ pg.isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ pg.noHistory }}\"><div style=\"color:#56627F;padding:16px 0\">No changes recorded yet.<\u002Fdiv><\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column\">\n            <sc-for list=\"{{ pg.history }}\" as=\"h\">\n              <div style=\"display:grid;grid-template-columns:130px 130px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #E7ECF4\">\n                <div style=\"color:#56627F;font-size:13px\">{{ h.when }}<\u002Fdiv>\n                <div style=\"font-size:13.5px\">{{ h.who }}<\u002Fdiv>\n                <div><div><span style=\"color:#46526F\">{{ h.what }}<\u002Fspan> {{ h.change }}<\u002Fdiv><sc-if value=\"{{ h.hasNote }}\"><div style=\"font-size:13px;color:#56627F;margin-top:2px\">{{ h.note }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- NEW PROGRAM WIZARD -->\n    <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"New Program\" style=\"padding:28px 32px 60px;max-width:960px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">New launch<\u002Fdiv>\n        <h1 style=\"font-size:26px;margin:2px 0 18px\">Set up a program<\u002Fh1>\n        <div style=\"display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap\">\n          <sc-for list=\"{{ w.steps }}\" as=\"st\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:20px;border:1px solid {{ st.border }};color:{{ st.fg }};font-size:13.5px\"><span style=\"width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:{{ st.dotBg }};color:{{ st.dotFg }}\">{{ st.n }}<\u002Fspan>{{ st.label }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ w.is1 }}\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:22px\">\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Program name<input value=\"{{ w.name }}\" sc-camel-on-change=\"{{ w.on.name }}\" placeholder=\"e.g. WSU Swim Safely Series\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:15px\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Location<input value=\"{{ w.location }}\" sc-camel-on-change=\"{{ w.on.location }}\" placeholder=\"Pool, city, state\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:15px\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Day 1 (start date)<input type=\"date\" value=\"{{ w.day1 }}\" sc-camel-on-change=\"{{ w.on.day1 }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:7px 10px;font-size:15px\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F;margin-bottom:8px\">Site-type profile<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px\">\n            <sc-for list=\"{{ w.types }}\" as=\"ty\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ ty.pick }}\" aria-pressed=\"{{ ty.selected }}\" style=\"text-align:left;background:{{ ty.bg }};border:1px solid {{ ty.border }};border-radius:8px;padding:12px;color:#14213D;cursor:pointer;display:flex;flex-direction:column;gap:6px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\"><span style=\"font-weight:500\">{{ ty.name }}<\u002Fspan><span style=\"font-size:12px;color:#56627F\">{{ ty.code }}<\u002Fspan><\u002Fdiv>\n                <div style=\"font-size:13px;color:#46526F;text-wrap:pretty\">{{ ty.desc }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#1F3A9E\">{{ ty.count }} tasks<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ w.is2 }}\">\n          <div style=\"color:#46526F;margin-bottom:14px\">Location-specific details. Leave blank if unknown — the partner can fill them in from their portal.<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n            <sc-for list=\"{{ w.siteFields }}\" as=\"f\">\n              <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">{{ f.label }}<input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.ph }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:15px\"><\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ w.is3 }}\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:6px\">\n            <div style=\"font-size:16px;font-weight:500\">{{ w.draftTitle }}<\u002Fdiv>\n            <div style=\"color:#46526F;font-size:13.5px\">{{ w.draftMeta }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"color:#56627F;font-size:13.5px;margin-bottom:12px\">Draft — uncheck tasks that don't apply or adjust dates before creating. Nothing is saved until you create the program.<\u002Fdiv>\n          <sc-if value=\"{{ w.hasPast }}\"><div style=\"padding:9px 12px;border:1px solid #E3B77A;background:#FFF6E8;border-radius:8px;color:#7A3E00;font-size:13.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-warning\"><\u002Fi>{{ w.pastLabel }}<\u002Fdiv><\u002Fsc-if>\n          <sc-for list=\"{{ w.phases }}\" as=\"ph\">\n            <section style=\"margin-bottom:16px\">\n              <h2 style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:#2E3A59\">{{ ph.label }}<\u002Fh2>\n              <div style=\"border:1px solid #E7ECF4;border-radius:8px;overflow:hidden\">\n                <sc-for list=\"{{ ph.rows }}\" as=\"r\">\n                  <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) 170px 150px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid #E7ECF4;background:#FFFFFF;opacity:{{ r.opacity }}\">\n                    <input type=\"checkbox\" aria-label=\"{{ r.incLabel }}\" checked=\"{{ r.include }}\" sc-camel-on-change=\"{{ r.onToggle }}\" style=\"accent-color:#2340A8;width:15px;height:15px\">\n                    <div style=\"min-width:0\"><div style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.name }}<\u002Fdiv><div style=\"font-size:12.5px;color:#56627F\">{{ r.timing }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"font-size:13px;color:{{ r.ownerColor }}\">{{ r.owner }}<\u002Fdiv>\n                    <input type=\"date\" aria-label=\"{{ r.dueAria }}\" value=\"{{ r.due }}\" sc-camel-on-change=\"{{ r.onDue }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:4px 6px;font-size:13px\">\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;gap:8px;margin-top:24px;align-items:center\">\n          <sc-if value=\"{{ w.canBack }}\"><button sc-camel-on-click=\"{{ w.back }}\" style=\"background:transparent;border:1px solid #8792AC;color:#2E3A59;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap;flex:none\">Back<\u002Fbutton><\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ w.next }}\" disabled=\"{{ w.nextDisabled }}\" style=\"background:transparent;border:1px solid #2340A8;color:#1F3A9E;border-radius:8px;padding:7px 16px;font-size:14px;font-weight:500;cursor:pointer;opacity:{{ w.nextOpacity }};white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\">{{ w.nextLabel }}<\u002Fbutton>\n          <span style=\"font-size:13px;color:#56627F\">{{ w.hint }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- TEMPLATE EDITOR -->\n    <sc-if value=\"{{ isTemplates }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Program Types\" style=\"padding:28px 32px 60px;max-width:1100px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Admin · starting checklists<\u002Fdiv>\n        <h1 style=\"font-size:26px;margin:2px 0 6px\">Program types<\u002Fh1>\n        <p style=\"color:#2E3A59;margin:0 0 14px;max-width:720px;font-size:15px;text-wrap:pretty\">Each program type is a ready-made checklist. When someone creates a new program, NMU Launch copies the checklist for its type and sets every due date by counting from the program's Day 1.<\u002Fp>\n        <div style=\"display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid #9DB4EC;background:#F2F6FD;border-radius:10px;margin-bottom:26px;max-width:760px\">\n          <i aria-hidden=\"true\" class=\"ph ph-info\" style=\"font-size:18px;color:#1F3A9E;margin-top:1px\"><\u002Fi>\n          <div style=\"font-size:14px;color:#14213D;text-wrap:pretty\">Changes here only affect <strong>programs created afterward<\u002Fstrong>. Programs already underway keep their own task lists — edit those from the program's timeline.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h2 style=\"font-size:17px;margin:0 0 10px\">1. Choose a program type<\u002Fh2>\n        <div role=\"group\" aria-label=\"Program type\" style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:30px\">\n          <sc-for list=\"{{ tp.types }}\" as=\"ty\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ ty.pick }}\" aria-pressed=\"{{ ty.selected }}\" style=\"text-align:left;background:{{ ty.bg }};border:2px solid {{ ty.border }};border-radius:10px;padding:14px;color:#14213D;cursor:pointer;display:flex;flex-direction:column;gap:6px\" style-hover=\"border-color:#2340A8\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\"><span style=\"font-weight:700;font-size:15px\">{{ ty.name }}<\u002Fspan><sc-if value=\"{{ ty.selected }}\"><i aria-hidden=\"true\" class=\"ph-fill ph-check-circle\" style=\"color:#2340A8;font-size:18px\"><\u002Fi><\u002Fsc-if><\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#46526F;text-wrap:pretty\">{{ ty.desc }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#1F3A9E;font-weight:600\">{{ ty.meta }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px\">\n          <div>\n            <h2 style=\"font-size:17px;margin:0 0 2px\">2. Review the {{ tp.selName }} checklist<\u002Fh2>\n            <div style=\"font-size:14px;color:#46526F\">{{ tp.summary }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ tp.add }}\" style=\"background:#2340A8;border:1px solid #2340A8;color:#FFFFFF;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none\" style-hover=\"background:#142B7A\"><i aria-hidden=\"true\" class=\"ph ph-plus\"><\u002Fi>Add a task<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px;padding:12px 14px;background:#FFFFFF;border:1px solid #D5DCE8;border-radius:10px\">\n          <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#2E3A59;flex:1;min-width:220px\">Search tasks<input type=\"search\" value=\"{{ tp.query }}\" sc-camel-on-change=\"{{ tp.onQuery }}\" placeholder=\"e.g. waiver, shipping, volunteers\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400\"><\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#2E3A59\">Example Day 1 for previewing dates<input type=\"date\" value=\"{{ tp.day1 }}\" sc-camel-on-change=\"{{ tp.onDay1 }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400\"><\u002Flabel>\n          <button sc-camel-on-click=\"{{ tp.toggleAll }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\">{{ tp.allLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ tp.noMatch }}\"><div style=\"padding:20px;border:1px dashed #A9B5CC;border-radius:8px;color:#46526F;margin-bottom:16px\">No tasks match \"{{ tp.query }}\".<\u002Fdiv><\u002Fsc-if>\n\n        <sc-for list=\"{{ tp.phases }}\" as=\"ph\" hint-placeholder-count=\"4\">\n          <section style=\"margin-bottom:10px;border:1px solid #D5DCE8;border-radius:10px;background:#FFFFFF;overflow:hidden\">\n            <h3 style=\"margin:0\">\n              <button sc-camel-on-click=\"{{ ph.toggle }}\" aria-expanded=\"{{ ph.open }}\" style=\"width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:transparent;border:0;cursor:pointer;color:#14213D;text-align:left;font-size:15px\" style-hover=\"background:#F2F6FD\">\n                <i aria-hidden=\"true\" class=\"{{ ph.chevron }}\" style=\"font-size:14px;color:#46526F\"><\u002Fi>\n                <span style=\"font-weight:700\">{{ ph.label }}<\u002Fspan>\n                <span style=\"font-size:13.5px;color:#56627F;font-weight:400\">{{ ph.countLabel }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:13px;color:#56627F;font-weight:400\">{{ ph.range }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fh3>\n            <sc-if value=\"{{ ph.open }}\">\n              <ul style=\"list-style:none;margin:0;padding:0;border-top:1px solid #E7ECF4\">\n                <sc-for list=\"{{ ph.rows }}\" as=\"r\">\n                  <li style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,200px) minmax(130px,170px) auto;gap:14px;align-items:center;padding:11px 14px;border-bottom:1px solid #E7ECF4\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font-weight:600;text-wrap:pretty\">{{ r.name }}<\u002Fdiv>\n                      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:4px\">\n                        <sc-if value=\"{{ r.partner }}\"><span style=\"font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#FFF1DE;color:#7A3E00\">Partner site does this<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ r.onlyHere }}\"><span style=\"font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#E4ECFC;color:#1A3A8F\">Only in {{ tp.selName }}<\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ r.hasWaits }}\"><span style=\"font-size:12px;color:#46526F;display:inline-flex;gap:4px;align-items:center\"><i aria-hidden=\"true\" class=\"ph ph-link\"><\u002Fi>Waits on: {{ r.waits }}<\u002Fspan><\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div><div style=\"font-size:14px\">{{ r.when }}<\u002Fdiv><div style=\"font-size:13px;color:#56627F\">{{ r.example }}<\u002Fdiv><\u002Fdiv>\n                    <div><div style=\"font-size:14px\">{{ r.role }}<\u002Fdiv><sc-if value=\"{{ r.hasSupport }}\"><div style=\"font-size:13px;color:#56627F\">with {{ r.support }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ r.edit }}\" aria-label=\"{{ r.editLabel }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none;padding:6px 12px\" style-hover=\"background:#E4ECFC\"><i aria-hidden=\"true\" class=\"ph ph-pencil-simple\"><\u002Fi>Edit<\u002Fbutton>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-for>\n\n        <sc-if value=\"{{ tp.hasExcluded }}\">\n          <section style=\"margin-top:28px\">\n            <h2 style=\"font-size:17px;margin:0 0 4px\">3. Optional: add tasks used by other types<\u002Fh2>\n            <p style=\"font-size:14px;color:#46526F;margin:0 0 10px\">These tasks exist in other checklists but not in {{ tp.selName }}.<\u002Fp>\n            <button sc-camel-on-click=\"{{ tp.toggleOther }}\" aria-expanded=\"{{ tp.showOther }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\"><i aria-hidden=\"true\" class=\"{{ tp.otherIcon }}\"><\u002Fi>{{ tp.otherLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ tp.showOther }}\">\n              <ul style=\"list-style:none;margin:12px 0 0;padding:0;border:1px solid #D5DCE8;border-radius:10px;background:#FFFFFF;overflow:hidden\">\n                <sc-for list=\"{{ tp.excluded }}\" as=\"x\">\n                  <li style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid #E7ECF4;flex-wrap:wrap\">\n                    <div style=\"min-width:0\"><div style=\"font-weight:600\">{{ x.name }}<\u002Fdiv><div style=\"font-size:13px;color:#56627F\">{{ x.when }} · used by {{ x.usedBy }}<\u002Fdiv><\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ x.add }}\" aria-label=\"{{ x.addLabel }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none;padding:6px 12px\" style-hover=\"background:#E4ECFC\"><i aria-hidden=\"true\" class=\"ph ph-plus\"><\u002Fi>Add to {{ tp.selName }}<\u002Fbutton>\n                  <\u002Fli>\n                <\u002Fsc-for>\n              <\u002Ful>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasTplEdit }}\">\n        <div style=\"position:fixed;inset:0;background:rgba(20,33,61,.5);z-index:50;display:grid;place-items:center;padding:20px\">\n          <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"te-title\" style=\"width:min(640px,100%);max-height:90vh;overflow:auto;background:#FFFFFF;box-shadow:0 24px 48px -12px rgba(20,33,61,.28);border-radius:14px;padding:22px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\">\n              <div><div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">{{ te.kicker }}<\u002Fdiv><h2 id=\"te-title\" style=\"font-size:20px;margin:4px 0 0\">{{ te.title }}<\u002Fh2><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ te.cancel }}\" aria-label=\"Close without saving\" style=\"background:transparent;border:0;color:#46526F;font-size:18px;cursor:pointer;padding:6px;border-radius:6px\"><i aria-hidden=\"true\" class=\"ph ph-x\"><\u002Fi><\u002Fbutton>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#2E3A59\">What needs to happen?<input id=\"te-name\" value=\"{{ te.name }}\" sc-camel-on-change=\"{{ te.onName }}\" placeholder=\"e.g. Confirm parking for instructors\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400\"><\u002Flabel>\n            <fieldset style=\"border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px\">\n              <legend style=\"font-size:13.5px;font-weight:600;color:#2E3A59;padding:0;margin-bottom:6px\">When is it due?<\u002Flegend>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n                <sc-if value=\"{{ te.notDuring }}\">\n                  <input type=\"number\" min=\"1\" aria-label=\"Amount\" value=\"{{ te.n }}\" sc-camel-on-change=\"{{ te.onN }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;width:80px\">\n                  <sc-raw-select aria-label=\"Unit\" key=\"{{ te.unitKey }}\" value=\"{{ te.unit }}\" sc-camel-on-change=\"{{ te.onUnit }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px\"><option value=\"days\">days<\u002Foption><option value=\"weeks\">weeks<\u002Foption><option value=\"months\">months<\u002Foption><\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-raw-select aria-label=\"Relative to\" key=\"{{ te.dirKey }}\" value=\"{{ te.dir }}\" sc-camel-on-change=\"{{ te.onDir }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px\"><option value=\"before\">before Day 1<\u002Foption><option value=\"during\">during the program, on day…<\u002Foption><option value=\"after\">after the program ends<\u002Foption><\u002Fsc-raw-select>\n                <sc-if value=\"{{ te.isDuring }}\">\n                  <sc-raw-select aria-label=\"Program day\" key=\"{{ te.dayKey }}\" value=\"{{ te.n }}\" sc-camel-on-change=\"{{ te.onN }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px\"><option value=\"1\">Day 1<\u002Foption><option value=\"2\">Day 2<\u002Foption><option value=\"3\">Day 3<\u002Foption><option value=\"4\">Day 4<\u002Foption><option value=\"5\">Day 5<\u002Foption><\u002Fsc-raw-select>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;color:#1A3A8F;background:#F2F6FD;border-radius:8px;padding:8px 10px\">{{ te.preview }}<\u002Fdiv>\n            <\u002Ffieldset>\n            <label style=\"display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:#2E3A59\">Who usually owns it?<sc-raw-select key=\"{{ te.roleKey }}\" value=\"{{ te.role }}\" sc-camel-on-change=\"{{ te.onRole }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;font-weight:400\"><sc-for list=\"{{ roles }}\" as=\"ro\"><option>{{ ro }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><span style=\"font-size:13px;font-weight:400;color:#56627F\">If exactly one active person has this role, they're assigned automatically.<\u002Fspan><\u002Flabel>\n            <label style=\"display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ te.partnerOwned }}\" sc-camel-on-change=\"{{ te.onPartner }}\" style=\"accent-color:#2340A8;width:18px;height:18px;margin:1px 0 0\"><span><strong>The partner site does this task<\u002Fstrong><br><span style=\"color:#56627F;font-size:13px\">It appears in the partner portal, and the site contact gets reminders.<\u002Fspan><\u002Fspan><\u002Flabel>\n            <fieldset style=\"border:0;padding:0;margin:0\">\n              <legend style=\"font-size:13.5px;font-weight:600;color:#2E3A59;padding:0;margin-bottom:8px\">Include in these program types<\u002Flegend>\n              <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px\">\n                <sc-for list=\"{{ te.types }}\" as=\"ty\"><label style=\"display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ ty.on }}\" sc-camel-on-change=\"{{ ty.toggle }}\" style=\"accent-color:#2340A8;width:18px;height:18px\">{{ ty.name }}<\u002Flabel><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Ffieldset>\n            <div>\n              <div id=\"te-deps-label\" style=\"font-size:13.5px;font-weight:600;color:#2E3A59;margin-bottom:6px\">Must wait for (optional)<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px\">\n                <sc-for list=\"{{ te.deps }}\" as=\"d\"><span style=\"display:inline-flex;gap:6px;align-items:center;font-size:13.5px;padding:4px 6px 4px 10px;border-radius:999px;background:#E7ECF4\">{{ d.name }}<button sc-camel-on-click=\"{{ d.remove }}\" aria-label=\"{{ d.removeLabel }}\" style=\"background:transparent;border:0;color:#2E3A59;cursor:pointer;padding:2px 4px;border-radius:999px;font-size:14px\"><i aria-hidden=\"true\" class=\"ph ph-x\"><\u002Fi><\u002Fbutton><\u002Fspan><\u002Fsc-for>\n                <sc-if value=\"{{ te.noDeps }}\"><span style=\"font-size:13.5px;color:#56627F\">Nothing — this task can start any time.<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-raw-select aria-labelledby=\"te-deps-label\" key=\"{{ te.depKey }}\" value=\"\" sc-camel-on-change=\"{{ te.onAddDep }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:8px 10px;font-size:14px;width:100%\"><option value=\"\">Add a task it waits for…<\u002Foption><sc-for list=\"{{ te.depOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <sc-if value=\"{{ te.hasError }}\"><div role=\"alert\" style=\"font-size:14px;color:#962B1E;background:#FBE4E0;border-radius:8px;padding:8px 10px\">{{ te.error }}<\u002Fdiv><\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px;border-top:1px solid #E7ECF4\">\n              <div><sc-if value=\"{{ te.canRemove }}\"><button sc-camel-on-click=\"{{ te.remove }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none;color:#962B1E;margin-top:12px\" style-hover=\"background:#FBE4E0\"><i aria-hidden=\"true\" class=\"ph ph-minus-circle\"><\u002Fi>Remove from {{ tp.selName }}<\u002Fbutton><\u002Fsc-if><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;margin-top:12px\">\n                <button sc-camel-on-click=\"{{ te.cancel }}\" style=\"background:#FFFFFF;border:1px solid #8792AC;color:#1F3A9E;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none;color:#2E3A59\" style-hover=\"background:#E7ECF4\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ te.save }}\" style=\"background:#2340A8;border:1px solid #2340A8;color:#FFFFFF;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none\" style-hover=\"background:#142B7A\">{{ te.saveLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n\n    <!-- CHANGE HISTORY -->\n    <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Change History\" style=\"padding:28px 32px 60px;max-width:1100px\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px\">\n          <div>\n            <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Record<\u002Fdiv>\n            <h1 style=\"font-size:26px;margin:2px 0 4px\">Change history<\u002Fh1>\n            <div style=\"color:#46526F\">Dates, statuses, owners and notes, across every launch.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-raw-select aria-label=\"Filter by program\" key=\"{{ histProgram }}\" value=\"{{ histProgram }}\" sc-camel-on-change=\"{{ onHistProgram }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:14px\">\n            <option value=\"all\">All programs<\u002Foption>\n            <sc-for list=\"{{ progOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E7ECF4;border-radius:8px;overflow:auto\">\n          <div style=\"display:grid;grid-template-columns:130px 120px minmax(160px,.8fr) minmax(260px,1.4fr);gap:12px;padding:8px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#56627F;border-bottom:1px solid #8792AC;min-width:760px\"><div>When<\u002Fdiv><div>Who<\u002Fdiv><div>Program<\u002Fdiv><div>Change<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ hist }}\" as=\"h\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:130px 120px minmax(160px,.8fr) minmax(260px,1.4fr);gap:12px;padding:10px 14px;border-bottom:1px solid #E7ECF4;background:#FFFFFF;min-width:760px\">\n              <div style=\"color:#56627F;font-size:13px\">{{ h.when }}<\u002Fdiv>\n              <div style=\"font-size:13.5px\">{{ h.who }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#2E3A59\">{{ h.program }}<\u002Fdiv>\n              <div><div><span style=\"color:#46526F\">{{ h.what }}<\u002Fspan> {{ h.change }}<\u002Fdiv><sc-if value=\"{{ h.hasNote }}\"><div style=\"font-size:13px;color:#56627F;margin-top:2px\">{{ h.note }}<\u002Fdiv><\u002Fsc-if><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- PARTNER PORTAL -->\n    <sc-if value=\"{{ isPortal }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Partner Portal\" style=\"padding:28px 32px 60px;max-width:980px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Partner portal · {{ po.org }}<\u002Fdiv>\n        <h1 style=\"font-size:26px;margin:2px 0 4px\">{{ po.name }}<\u002Fh1>\n        <div style=\"color:#46526F;margin-bottom:20px\">Day 1 is {{ po.day1 }} · {{ po.countdown }}. You see only the tasks your site owns.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:start\">\n          <div style=\"border:1px solid #E7ECF4;border-radius:8px;overflow:hidden\">\n            <sc-for list=\"{{ po.tasks }}\" as=\"t\">\n              <div sc-camel-on-click=\"{{ t.open }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 110px 124px;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid #E7ECF4;cursor:pointer;background:#FFFFFF\" style-hover=\"background:#F2F6FD\">\n                <div style=\"min-width:0\"><button sc-camel-on-click=\"{{ t.open }}\" style=\"background:transparent;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-align:left;cursor:pointer;white-space:nowrap;flex:none\">{{ t.name }}<\u002Fbutton><div style=\"font-size:13px;color:#56627F\">{{ t.timing }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"font-size:13.5px\">{{ t.dueLabel }}<\u002Fdiv><div style=\"font-size:12.5px;color:{{ t.relColor }}\">{{ t.relLabel }}<\u002Fdiv><\u002Fdiv>\n                <sc-raw-select value=\"{{ t.status }}\" aria-label=\"{{ t.statusLabel }}\" sc-camel-on-click=\"{{ stop }}\" sc-camel-on-change=\"{{ t.onStatus }}\" style=\"border:0;border-radius:4px;padding:4px 6px;font-size:13px;background:{{ t.statusBg }};color:{{ t.statusFg }};cursor:pointer\"><option>Not started<\u002Foption><option>In progress<\u002Foption><option>Blocked<\u002Foption><option>Done<\u002Foption><\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid #E7ECF4;border-radius:8px;background:#FFFFFF\">\n            <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Your NMU contact<\u002Fdiv>\n            <div><div style=\"font-weight:500\">{{ po.pm }}<\u002Fdiv><div style=\"font-size:13px;color:#46526F\">{{ po.pmEmail }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F;margin-top:6px\">Site on file<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#2E3A59\">{{ po.shipping }}<\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#2E3A59\">{{ po.hours }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#56627F\">Email reminders arrive 7 days before and on each due date.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ADMIN -->\n    <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Admin\" style=\"padding:28px 32px 60px;max-width:1100px\">\n        <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">Admin<\u002Fdiv>\n        <h1 style=\"font-size:26px;margin:2px 0 4px\">Users &amp; data<\u002Fh1>\n        <div style=\"color:#46526F;margin-bottom:18px\">Add staff and partner contacts, set roles, and check the data connection.<\u002Fdiv>\n        <div style=\"border:1px solid #E7ECF4;border-radius:8px;overflow:auto;margin-bottom:12px\">\n          <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,1fr) 190px 200px 90px;gap:10px;padding:8px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#56627F;border-bottom:1px solid #8792AC;min-width:860px\"><div>Name<\u002Fdiv><div>Email<\u002Fdiv><div>Role<\u002Fdiv><div>Partner program<\u002Fdiv><div>Access<\u002Fdiv><\u002Fdiv>\n          <sc-for list=\"{{ ad.users }}\" as=\"u\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,1fr) 190px 200px 90px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid #E7ECF4;background:#FFFFFF;opacity:{{ u.opacity }};min-width:860px\">\n              <div style=\"font-weight:500\">{{ u.name }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#46526F\">{{ u.email }}<\u002Fdiv>\n              <sc-raw-select aria-label=\"{{ u.roleAria }}\" key=\"{{ u.roleKey }}\" value=\"{{ u.role }}\" sc-camel-on-change=\"{{ u.onRole }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:5px 6px;font-size:13.5px\"><sc-for list=\"{{ roles }}\" as=\"ro\"><option>{{ ro }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n              <div>\n                <sc-if value=\"{{ u.isPartner }}\"><sc-raw-select aria-label=\"{{ u.progAria }}\" key=\"{{ u.progKey }}\" value=\"{{ u.programId }}\" sc-camel-on-change=\"{{ u.onProgram }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:5px 6px;font-size:13.5px;width:100%\"><option value=\"\">— choose —<\u002Foption><sc-for list=\"{{ progOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.name }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Fsc-if>\n                <sc-if value=\"{{ u.notPartner }}\"><span style=\"font-size:13px;color:#5E6987\">All programs<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ u.toggle }}\" disabled=\"{{ u.isMe }}\" style=\"background:transparent;border:1px solid #8792AC;color:#2E3A59;border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none\">{{ u.activeLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:grid;grid-template-columns:minmax(140px,1fr) minmax(180px,1fr) 190px 200px 90px;gap:10px;align-items:center;padding:8px 12px;min-width:860px\">\n            <input value=\"{{ nu.name }}\" sc-camel-on-change=\"{{ nu.onName }}\" placeholder=\"New user name\" aria-label=\"New user name\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:13.5px\">\n            <input value=\"{{ nu.email }}\" sc-camel-on-change=\"{{ nu.onEmail }}\" placeholder=\"email@nmu.org\" aria-label=\"New user email\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:13.5px\">\n            <sc-raw-select aria-label=\"New user role\" key=\"{{ nu.role }}\" value=\"{{ nu.role }}\" sc-camel-on-change=\"{{ nu.onRole }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:5px 6px;font-size:13.5px\"><sc-for list=\"{{ roles }}\" as=\"ro\"><option>{{ ro }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select>\n            <div style=\"font-size:13px;color:{{ nu.msgColor }}\">{{ nu.msg }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ nu.add }}\" disabled=\"{{ nu.invalid }}\" style=\"background:transparent;border:1px solid #2340A8;color:#1F3A9E;border-radius:6px;padding:5px 8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;flex:none\" style-hover=\"background:#E4ECFC\">Add user<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:28px\">\n          <div style=\"padding:16px;border:1px solid #E7ECF4;border-radius:8px;background:#FFFFFF;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\"><div style=\"font-weight:500;font-size:15px\">Airtable connection<\u002Fdiv><span style=\"display:inline-flex;gap:6px;align-items:center;font-size:13px;color:#2E3A59\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ modeDot }}\"><\u002Fspan>{{ modeLabel }}<\u002Fspan><\u002Fdiv>\n            <div style=\"font-size:13.5px;color:#46526F;text-wrap:pretty\">{{ ad.modeHelp }}<\u002Fdiv>\n display:flex;justify-content:space-between;gap:10px;align-items:flex-start\">\n        <div style=\"min-width:0\">\n          <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#56627F\">{{ dr.kicker }}<\u002Fdiv>\n          <h2 id=\"drawer-title\" style=\"font-size:19px;margin:4px 0 0;text-wrap:pretty\">{{ dr.name }}<\u002Fh2>\n        <\u002Fdiv>\n        <button id=\"drawer-close\" aria-label=\"Close task details\" sc-camel-on-click=\"{{ closeTask }}\" style=\"background:transparent;border:0;color:#46526F;font-size:18px;cursor:pointer;padding:6px;border-radius:6px;white-space:nowrap;flex:none\"><i aria-hidden=\"true\" class=\"ph ph-x\"><\u002Fi><\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n        <sc-for list=\"{{ dr.tags }}\" as=\"tg\"><span style=\"font-size:12px;padding:2px 7px;border-radius:4px;border:1px solid #A9B5CC;color:#2E3A59\">{{ tg }}<\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:12.5px;color:#56627F;margin-bottom:6px\">Status<\u002Fdiv>\n        <div role=\"group\" aria-label=\"Status\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:4px\">\n          <sc-for list=\"{{ dr.statusOpts }}\" as=\"so\"><button sc-camel-on-click=\"{{ so.set }}\" aria-pressed=\"{{ so.selected }}\" disabled=\"{{ dr.lockStatus }}\" style=\"border:1px solid {{ so.border }};background:{{ so.bg }};color:{{ so.fg }};border-radius:6px;padding:6px 4px;font-size:13px;cursor:pointer;white-space:nowrap;flex:none\">{{ so.label }}<\u002Fbutton><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n        <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Due date<input type=\"date\" value=\"{{ dr.due }}\" sc-camel-on-change=\"{{ dr.onDue }}\" disabled=\"{{ dr.lockPlan }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:14px\"><\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:#56627F\">Owner · {{ dr.role }}<sc-raw-select key=\"{{ dr.ownerKey }}\" value=\"{{ dr.ownerId }}\" sc-camel-on-change=\"{{ dr.onOwner }}\" disabled=\"{{ dr.lockPlan }}\" style=\"background:#FBF8F1;border:1px solid #8792AC;color:#14213D;border-radius:6px;padding:6px 8px;font-size:14px\"><option value=\"\">Unassigned<\u002Foption><sc-for list=\"{{ dr.ownerOpts }}\" as=\"o\"><option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fsc-raw-select><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"font-size:13px;color:#56627F;display:flex;gap:6px;align-items:flex-start\"><i aria-hidden=\"true\" class=\"ph ph-envelope-simple\" style=\"margin-top:2px\"><\u002Fi><span>{{ dr.reminder }}<\u002Fspan><\u002Fdiv>\n      <sc-if value=\"{{ dr.hasDeps }}\">\n        <div>\n          <div style=\"font-size:12.5px;color:#56627F;margin-bottom:6px\">Depends on<\u002Fdiv>\n          <sc-for list=\"{{ dr.deps }}\" as=\"d\"><div sc-camel-on-click=\"{{ d.open }}\" style=\"display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid #8792AC;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13.5px\" style-hover=\"background:#E7ECF4\"><span>{{ d.name }}<\u002Fspan><span style=\"font-size:12px;padding:1px 6px;border-radius:4px;background:{{ d.bg }};color:{{ d.fg }};flex:none\">{{ d.status }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ dr.hasBlocks }}\">\n        <div>\n          <div style=\"font-size:12.5px;color:#56627F;margin-bottom:6px\">Unblocks<\u002Fdiv>\n          <sc-for list=\"{{ dr.blocks }}\" as=\"d\"><div sc-camel-on-click=\"{{ d.open }}\" style=\"display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid #8792AC;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13.5px\" style-ho
